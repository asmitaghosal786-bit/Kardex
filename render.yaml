services:
  - type: web
    name: subscription-guardian-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PATH
        value: guardian.db
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: SUPABASE_JWT_AUDIENCE
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: DEMO_MODE
        value: "false"
  - type: web
    name: subscription-guardian-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_AG_STUDIO_ENABLED
        value: "true"
      - key: VITE_AG_LICENSE
        sync: false

